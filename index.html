<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepoRadar</title>
<style>
body{background:#10131c;color:white;font-family:Arial,sans-serif;padding:25px;max-width:650px;margin:auto}
h1{color:#70a5ff;font-size:38px}
p{color:#b8c2d8}
input,button{padding:14px;border-radius:9px;border:0;font-size:16px;margin:6px 0;width:100%;box-sizing:border-box}
button{background:#3978f6;color:white;font-weight:bold}
#result{background:#20283a;padding:18px;border-radius:12px;margin-top:20px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>🔎 RepoRadar</h1>
<p>Discover what's really happening inside a GitHub repository.</p>
<input id="repo" placeholder="owner/repository">
<button onclick="analyze()">Analyze repository</button>
<div id="result">Your repository report will appear here.</div>

<script>
async function analyze(){
 const name=document.getElementById("repo").value.trim();
 const out=document.getElementById("result");
 if(!/^[^/]+\/[^/]+$/.test(name)){
  out.textContent="Enter a repository as owner/name.";
  return;
 }
 out.textContent="Scanning repository...";
 try{
  const response=await fetch("https://api.github.com/repos/"+name);
  if(!response.ok) throw new Error("Repository not found or API limit reached.");
  const r=await response.json();
  const age=(Date.now()-new Date(r.updated_at).getTime())/86400000;
  let score=100;
  if(age>365) score-=35;
  else if(age>90) score-=15;
  if(r.stargazers_count<10) score-=10;
  if(r.description===null) score-=10;
  score=Math.max(0,score);
  let roast=age>365?"This repository has been taking a very long nap.":age>90?"The activity is getting a little quiet.":"This repository is showing signs of life!";
  out.textContent=
   "📡 REPORADAR REPORT\n\n"+
   "Repository: "+r.full_name+"\n"+
   "⭐ Stars: "+r.stargazers_count+"\n"+
   "🍴 Forks: "+r.forks_count+"\n"+
   "🐛 Open issues: "+r.open_issues_count+"\n"+
   "📅 Last updated: "+new Date(r.updated_at).toDateString()+"\n\n"+
   "💯 CODE HEALTH SCORE: "+score+"/100\n\n"+
   "🔥 REPO ROAST:\n"+roast+
   "\n\nNote: This is an early activity-based score, not a full code review.";
 }catch(e){out.textContent="⚠️ "+e.message;}
}
</script>
</body>
</html>
