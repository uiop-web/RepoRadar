
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepoRadar 2.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131c;color:#fff;font-family:Arial,sans-serif;padding:25px;max-width:720px;margin:auto}
h1{color:#70a5ff;font-size:38px}
p{color:#b8c2d8;line-height:1.6}
input,button{padding:15px;border-radius:9px;border:0;font-size:16px;margin:7px 0;width:100%}
input{background:#20283a;color:white;border:1px solid #45516a}
button{background:#3978f6;color:white;font-weight:bold;cursor:pointer}
.card{background:#20283a;padding:18px;border-radius:12px;margin-top:16px}
.score{font-size:42px;font-weight:bold;color:#70a5ff}
.item{padding:10px 0;border-bottom:1px solid #39445a}
.small{font-size:13px;color:#aebbd2}
</style>
</head>
<body>
<h1>🔎 RepoRadar <span class="small">2.0</span></h1>
<p>Discover repository health. Find warning signs. Get roasted by the facts.</p>

<input id="repo" placeholder="owner/repository">
<button id="scan" onclick="analyze()">Analyze repository</button>
<div id="result" class="card">Your repository report will appear here.</div>

<script>
const api="https://api.github.com";

async function get(url){
 const r=await fetch(url);
 if(!r.ok) throw new Error("GitHub API error: "+r.status);
 return r.json();
}

async function analyze(){
 const name=document.getElementById("repo").value.trim();
 const out=document.getElementById("result");
 const btn=document.getElementById("scan");

 if(!/^[^/\s]+\/[^/\s]+$/.test(name)){
  out.textContent="Please enter a repository as owner/name.";
  return;
 }

 btn.disabled=true;
 btn.textContent="Scanning...";
 out.textContent="Checking repository information...";

 try{
  const r=await get(api+"/repos/"+name);
  const [root,commits,releases]=await Promise.all([
   get(api+"/repos/"+name+"/contents/"),
   get(api+"/repos/"+name+"/commits?per_page=1"),
   get(api+"/repos/"+name+"/releases?per_page=1")
  ]);

  const files=root.map(x=>x.name.toLowerCase());
  const hasReadme=files.some(x=>x.startsWith("readme"));
  const hasLicense=files.some(x=>x.startsWith("license")||x.startsWith("licence"));
  const hasContributing=files.some(x=>x.startsWith("contributing"));
  const hasTests=files.some(x=>x.includes("test")||x.includes("spec"));
  const hasWorkflow=files.includes(".github");

  const age=(Date.now()-new Date(r.pushed_at||r.updated_at))/86400000;
  const latest=commits[0]?.commit?.committer?.date;
  const commitAge=latest?(Date.now()-new Date(latest))/86400000:9999;

  let score=100;
  const findings=[];

  function check(ok,points,good,bad){
   if(ok){findings.push("✅ "+good);}
   else{score-=points;findings.push("⚠️ "+bad);}
  }

  check(hasReadme,15,"README found","No README detected");
  check(hasLicense,15,"Licence file found","No licence file detected");
  check(hasContributing,10,"Contribution guide found","No contribution guide detected");
  check(hasTests,15,"Possible test directory found","No obvious test directory found");
  check(hasWorkflow,10,"GitHub configuration directory found","No .github directory detected");

  if(commitAge<=30)findings.push("✅ Recent commit activity");
  else if(commitAge<=180){score-=10;findings.push("⚠️ Last commit was over 30 days ago");}
  else{score-=20;findings.push("⚠️ Last commit was over 180 days ago");}

  if(r.archived){score-=25;findings.push("⚠️ Repository is archived");}
  if(r.open_issues_count>100){score-=5;findings.push("⚠️ Large number of open issues");}
  if(!releases.length){score-=5;findings.push("⚠️ No published releases detected");}
  else{findings.push("✅ At least one published release");}

  score=Math.max(0,Math.min(100,score));

  const problems=findings.filter(x=>x.startsWith("⚠️"));
  let roast="A respectable repository. The radar has no major complaints today.";
  if(problems.length>=5)roast="This repository needs a maintenance meeting. Bring snacks. 🍿";
  else if(problems.length>=3)roast="The codebase has a few things it would rather not discuss. 👀";
  else if(problems.length>=1)roast="Not bad, but the radar has receipts. 🧾";

  out.innerHTML=`
   <h2>📡 REPORADAR REPORT</h2>
   <h3>${r.full_name}</h3>
   <div class="score">${score}/100</div>
   <p>Repository maintenance score</p>
   <div class="item">⭐ Stars: ${r.stargazers_count.toLocaleString()}</div>
   <div class="item">🍴 Forks: ${r.forks_count.toLocaleString()}</div>
   <div class="item">🐛 Open issues: ${r.open_issues_count.toLocaleString()}</div>
   <div class="item">📅 Last pushed: ${new Date(r.pushed_at||r.updated_at).toDateString()}</div>
   <h3>🔍 Findings</h3>
   ${findings.map(x=>`<div class="item">${x}</div>`).join("")}
   <h3>🔥 REPO ROAST</h3>
   <p>${roast}</p>
   <p class="small">This is a preliminary maintenance assessment based on public repository metadata and root-level files. It does not inspect code quality or verify test coverage.</p>
   <button onclick="shareReport('${r.full_name}',${score})">Share result</button>
  `;
 }catch(e){
  out.textContent="⚠️ "+e.message+". Check the repository name or try again later.";
 }finally{
  btn.disabled=false;
  btn.textContent="Analyze repository";
 }
}

function shareReport(name,score){
 const text="RepoRadar scored "+name+" "+score+"/100. Check your repository!";
 if(navigator.share){
  navigator.share({title:"RepoRadar report",text:text}).catch(()=>{});
 }else if(navigator.clipboard){
  navigator.clipboard.writeText(text).then(()=>alert("Report copied!"));
 }else{
  alert(text);
 }
}
</script>
</body>
</html>
